name: Deploy docs/site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the deployment set (index.html, style.css, assets/)
        run: |
          mkdir -p _site/assets
          cp docs/site/index.html docs/site/style.css _site/
          cp -r docs/site/assets/. _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
