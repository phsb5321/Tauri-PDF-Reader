name: Packaged User Gate

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *" # nightly full matrix

concurrency:
  group: packaged-user-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CI: "true"

jobs:
  contract:
    name: Gate contract (workflow cannot silently drop the gate)
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Contract — the workflow must always run the packaged gate
        run: ./tools/check-packaged-gate-contract.sh .github/workflows/packaged-user-gate.yml
      - name: Contract negative-control — the check must CATCH a dropped gate
        run: ./tools/test/packaged-gate-contract-negative-control.sh

  pr-fast:
    name: Packaged PR-fast lane (critical-loop)
    if: github.event_name == 'pull_request'
    needs: contract
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Assert tauri-driver provisioned (BLOCKED if missing — never runtime-install)
        # wdio.conf.mjs looks up the driver PATH-first with a ~/.cargo/bin
        # fallback. Runtime `cargo install` is rejected by review: unpinned
        # supply chain + cold-compile time on the single-slot runner. Missing
        # tooling is BLOCKED per the gate contract — and on BLOCKED a
        # machine-readable prerequisite-failure receipt is written into the
        # workspace BEFORE exiting, because at this point no /tmp lane log
        # exists yet and every red must upload evidence (never a bare
        # no-files-found warning). Provision the host once, deliberately:
        # nix profile install github:phsb5321/Tauri-PDF-Reader/main#tauri-driver
        # && ln -s ~/.nix-profile/bin/tauri-driver ~/.cargo/bin/tauri-driver.
        run: |
          DRIVER="$HOME/.cargo/bin/tauri-driver"
          if [ ! -x "$DRIVER" ]; then
            mkdir -p ci-evidence
            printf '{"blocked":"tauri-driver not provisioned","path":"%s","remedy":"nix profile install github:phsb5321/Tauri-PDF-Reader/main#tauri-driver && ln -s ~/.nix-profile/bin/tauri-driver ~/.cargo/bin/tauri-driver","time":"%s"}\n' "$DRIVER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-evidence/prerequisite-failure.json
            echo "BLOCKED: tauri-driver not provisioned at $DRIVER — see ci-evidence/prerequisite-failure.json"
            exit 1
          fi
          "$DRIVER" --help >/dev/null 2>&1

      - name: Packaged PR-fast lane — hermetic profile, X11 pin, Xvfb
        # The repo's own runner: shared profile (#99 fail-closed) + flake
        # devShell toolchain (#101 single source) + GDK_BACKEND=x11 (the
        # negative-devicePixelRatio class) + Xvfb via -displayfd. The fixed
        # /tmp evidence paths are cleared first so a failure can only copy
        # THIS run's logs (a prior job's leftovers must never ride along).
        run: |
          rm -f /tmp/lectrice-e2e-critical-loop-xvfb.log /tmp/lectrice-matrix-critical-loop.log
          bash e2e/run-critical-loop.sh

      - name: Copy failure evidence into the workspace (upload-artifact cannot read /tmp)
        if: failure()
        run: |
          mkdir -p ci-evidence
          cp /tmp/lectrice-e2e-critical-loop-xvfb.log ci-evidence/ 2>/dev/null || true
          cp /tmp/lectrice-matrix-critical-loop.log ci-evidence/ 2>/dev/null || true

      - name: Upload failure artifacts (honest evidence, never skipped-green)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-fast-failure-evidence
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 7

  full-matrix:
    name: Full packaged matrix (all lanes, strictly serial)
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Assert tauri-driver provisioned (BLOCKED if missing — never runtime-install)
        run: |
          DRIVER="$HOME/.cargo/bin/tauri-driver"
          if [ ! -x "$DRIVER" ]; then
            mkdir -p ci-evidence
            printf '{"blocked":"tauri-driver not provisioned","path":"%s","remedy":"nix profile install github:phsb5321/Tauri-PDF-Reader/main#tauri-driver && ln -s ~/.nix-profile/bin/tauri-driver ~/.cargo/bin/tauri-driver","time":"%s"}\n' "$DRIVER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-evidence/prerequisite-failure.json
            echo "BLOCKED: tauri-driver not provisioned at $DRIVER — see ci-evidence/prerequisite-failure.json"
            exit 1
          fi
          "$DRIVER" --help >/dev/null 2>&1

      - name: Run all packaged lanes — one at a time
        # Serial by construction: one job loops the eight self-contained lane
        # runners. The single-slot runner must never be stampeded. Fixed /tmp
        # evidence paths cleared first — stale artifacts must never ride along.
        run: |
          rm -f /tmp/lectrice-matrix-*.log /tmp/lectrice-e2e-*-xvfb.log
          bash scripts/e2e-matrix.sh

      - name: Copy failure evidence into the workspace (upload-artifact cannot read /tmp)
        if: failure()
        run: |
          mkdir -p ci-evidence
          cp /tmp/lectrice-matrix-*.log ci-evidence/ 2>/dev/null || true
          cp /tmp/lectrice-e2e-*-xvfb.log ci-evidence/ 2>/dev/null || true

      - name: Upload failure artifacts (per-lane evidence)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-matrix-failure-evidence
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 7

  real-corpus:
    # Post-merge/manual REAL-corpus soak (docs/packaged-lanes.md). NEVER on
    # pull_request — PR-fast stays deterministic fixtures. Consumes
    # LECTRICE_REAL_PDF_CORPUS (a LOCAL dir on the runner; the five-book Data
    # Engineering corpus). Copyright boundary: the hook stages a TRANSIENT
    # copy inside the hermetic profile (fs scope) and the artifact upload
    # below carries ONLY logs + summary — never PDFs or derived renders.
    name: Real-corpus soak (real PDFs, post-merge/manual)
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Assert tauri-driver provisioned (BLOCKED if missing — never runtime-install)
        run: |
          DRIVER="$HOME/.cargo/bin/tauri-driver"
          if [ ! -x "$DRIVER" ]; then
            mkdir -p ci-evidence
            printf '{"blocked":"tauri-driver not provisioned","path":"%s","remedy":"nix profile install github:phsb5321/Tauri-PDF-Reader/main#tauri-driver && ln -s ~/.nix-profile/bin/tauri-driver ~/.cargo/bin/tauri-driver","time":"%s"}\n' "$DRIVER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-evidence/prerequisite-failure.json
            echo "BLOCKED: tauri-driver not provisioned at $DRIVER — see ci-evidence/prerequisite-failure.json"
            exit 1
          fi
          "$DRIVER" --help >/dev/null 2>&1

      - name: Assert the real corpus is provisioned locally (BLOCKED if missing)
        # The corpus lives on the host (never a URL); the hook never stores
        # or uploads the PDFs. Same receipt discipline as the driver assert:
        # a machine-readable prerequisite-failure.json is written before exit
        # so this red always carries evidence.
        run: |
          if [ -z "$LECTRICE_REAL_PDF_CORPUS" ]; then
            mkdir -p ci-evidence
            printf '{"blocked":"LECTRICE_REAL_PDF_CORPUS unset","remedy":"set it in the runner .env (local dir, e.g. /home/notroot/corpus-de)","time":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-evidence/prerequisite-failure.json
            echo "BLOCKED: LECTRICE_REAL_PDF_CORPUS unset — see ci-evidence/prerequisite-failure.json"
            exit 1
          fi
          [ -d "$LECTRICE_REAL_PDF_CORPUS" ] || { echo "BLOCKED: LECTRICE_REAL_PDF_CORPUS=$LECTRICE_REAL_PDF_CORPUS is not a directory"; exit 1; }

      - name: Run the real-corpus soak (per-book phases, machine-readable summary)
        run: |
          rm -rf /tmp/lectrice-corpus
          bash scripts/e2e-real-corpus.sh

      - name: Copy evidence into the workspace (logs + summary ONLY — never the corpus)
        run: |
          mkdir -p ci-evidence/corpus
          cp -r /tmp/lectrice-corpus/* ci-evidence/corpus/ 2>/dev/null || true

      - name: Upload corpus soak evidence (logs + summary; PDFs never leave the host)
        uses: actions/upload-artifact@v4
        with:
          name: real-corpus-evidence
          path: |
            ci-evidence/corpus/
            ci-evidence/prerequisite-failure.json
          if-no-files-found: error
          retention-days: 7
