name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  alignment-gate:
    name: Alignment Gate
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the --base diff

      - name: Run alignment gate (PR diff vs base)
        # Catches completion-theater (TODO/stub in "done" code), skipped/.only
        # tests, added lint-suppressions, debug artifacts — the class no linter
        # sees. Vendored from Pedro's experiments/alignment-gate (Standard —
        # Project Quality & Alignment Enforcement). Zero-dep (git+grep+awk).
        run: ./tools/alignment-gate.sh --base origin/${{ github.base_ref }}

      - name: Alignment gate negative-control
        # PR#595 parity: prove the gate CATCHES slop, not just PASSES on clean
        # code. Creates a deliberate slop diff + asserts the gate fails.
        run: ./tools/test/alignment-gate-negative-control.sh

  frontend:
    name: Frontend Checks
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.job }}

      # No pnpm store cache. The runner is self-hosted (vm103) and the store
      # lives at ~/.local/share/pnpm/store — outside the workspace, so it
      # survives `actions/checkout`'s clean and is already warm on the next
      # run. The GitHub cache round-trip added nothing and broke every frontend
      # job: `Post Setup pnpm cache` stalled uploading the 677 MB store at
      # "Sent 0 of 677350749 (0.0%)" until `timeout-minutes: 10` cancelled the
      # job, so the job reported `failure` with every substantive step green.
      # It could not recover on its own — the entry was never written, so the
      # next run missed, tried to save, and stalled again.

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: ESLint Boundaries
        run: pnpm lint:boundaries

      - name: Run tests
        run: pnpm test:run

      - name: Architecture tests
        run: pnpm test:arch

      - name: Knip (dead-code detection, report-only)
        # Whole-module-graph dead-code gate for the TS frontend — catches unused
        # files/exports/deps that tsc/ESLint structurally can't see. #1
        # agent-slop signature per Pedro's Quality Enforcement Standard.
        #
        # RATCHET PHASE 1 (report-only): knip currently reports 54 "unused files"
        # that are actually React components reached via `@/components/...` path
        # aliases — knip's path-alias resolution isn't tracing them. --no-exit-code
        # keeps CI green while the config is tuned; flip to blocking once the
        # path-alias issue is resolved (tsconfig paths wiring OR explicit entry
        # list). Per the Standard: "start lenient on legacy repos, ratchet up."
        run: pnpm knip --no-exit-code

      - name: Type coverage ratchet (≥ 99.9%)
        # Pedro's Quality Enforcement Standard TS-monorepo lever #2: closes the
        # `as any` escape hatch agents use to green `tsc`. Floor pinned at the
        # measured baseline (25246/25269 = 99.90%); ratchets UP as `any` is
        # removed, never loosens.
        run: pnpm type-coverage

      - name: Coverage check
        run: pnpm test:coverage

  backend:
    name: Backend Checks
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libspeechd-dev libasound2-dev libssl-dev pkg-config clang libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # See the note on the same step in contract-tests below: on a persistent
      # single-slot runner the cargo cache round-trip cost more than the work
      # it saved, so the artifacts live outside the workspace instead.
      - name: Persist cargo artifacts outside the workspace
        run: echo "CARGO_TARGET_DIR=$HOME/ci-cargo/lectrice/target" >> "$GITHUB_ENV"

      - name: Stub frontend dist (tauri generate_context! reads frontendDist)
        run: |
          mkdir -p dist
          echo '<!doctype html><meta charset="utf-8"><title>Lectrice</title>' > dist/index.html

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --features test-mocks

      - name: Domain tests timing validation
        working-directory: src-tauri
        run: |
          START_TIME=$(date +%s)
          cargo test domain:: --features test-mocks --lib -- --test-threads=1 2>&1 || true
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "Domain tests completed in ${DURATION}s"
          if [ $DURATION -gt 5 ]; then
            echo "::warning::Domain tests took ${DURATION}s (expected <5s for pure domain logic)"
          fi

      - name: Build check
        working-directory: src-tauri
        run: cargo build --release

  contract-tests:
    name: Contract Tests
    runs-on: [self-hosted, Linux, X64, vm103]
    # 20, not 10, because the wall was being spent on the cache and not on the
    # tests. Measured on run 31928286378 at 3da0320, where every step reported
    # success and the job still ended `cancelled`:
    #   Set up runner            2m56s
    #   Cache cargo registry     5m39s   <- restoring ~/.cargo + src-tauri/target
    #   Run contract tests         59s   <- the actual subject of this job
    #   everything else            ~36s
    #                            ------
    #                            10m10s  against a 10m wall
    # Same class as the Frontend Checks cache stall documented above, on the
    # restore side rather than the save side. Raising the wall is the small
    # fix; the real one is to stop round-tripping a multi-GB `src-tauri/target`
    # through the cache on a persistent single-slot runner (docs/ci-runner-ops.md).
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libspeechd-dev libasound2-dev libssl-dev pkg-config clang libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The cargo cache is GONE, not moved. `~/.cargo/registry`, `~/.cargo/git`
      # and this target dir all live in $HOME on a PERSISTENT runner, so they
      # already survive between jobs; `actions/cache` was uploading and
      # restoring a multi-gigabyte `src-tauri/target` that never needed to
      # travel. It was not free: the restore alone took 5m39s of a 10m wall on
      # run 31928286378, and on run 31934817394 both Rust jobs DIED inside the
      # cache step (Contract Tests failed mid-restore; Backend Checks ran 20
      # minutes and was cancelled with no steps recorded at all).
      #
      # `target/` had to be cached only because it sat INSIDE the workspace,
      # which `actions/checkout` cleans. Moving it out removes the reason.
      # The path is `.../lectrice/target` on purpose: the host's runner-gc
      # prunes directories NAMED `target` that have been idle >6h, so a quiet
      # week reclaims the disk and a busy one keeps the artifacts warm.
      # This is the fix docs/ci-runner-ops.md asked for after #52 did the same
      # for the pnpm store.
      - name: Persist cargo artifacts outside the workspace
        run: echo "CARGO_TARGET_DIR=$HOME/ci-cargo/lectrice/target" >> "$GITHUB_ENV"

      - name: Stub frontend dist (tauri generate_context! reads frontendDist)
        run: |
          mkdir -p dist
          echo '<!doctype html><meta charset="utf-8"><title>Lectrice</title>' > dist/index.html

      - name: Run contract tests
        working-directory: src-tauri
        run: cargo test --features test-mocks --test '*'
