name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  alignment-gate:
    name: Alignment Gate
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the --base diff

      - name: Run alignment gate (PR diff vs base)
        # Catches completion-theater (TODO/stub in "done" code), skipped/.only
        # tests, added lint-suppressions, debug artifacts — the class no linter
        # sees. Vendored from Pedro's experiments/alignment-gate (Standard —
        # Project Quality & Alignment Enforcement). Zero-dep (git+grep+awk).
        run: ./tools/alignment-gate.sh --base origin/${{ github.base_ref }}

      - name: Alignment gate negative-control
        # PR#595 parity: prove the gate CATCHES slop, not just PASSES on clean
        # code. Creates a deliberate slop diff + asserts the gate fails.
        run: ./tools/test/alignment-gate-negative-control.sh

  frontend:
    name: Frontend Checks
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: ESLint Boundaries
        run: pnpm lint:boundaries

      - name: Run tests
        run: pnpm test:run

      - name: Architecture tests
        run: pnpm test:arch

      - name: Knip (dead-code detection)
        # Whole-module-graph dead-code gate for the TS frontend — catches unused
        # files/exports/deps that tsc/ESLint structurally can't see. #1
        # agent-slop signature per Pedro's Quality Enforcement Standard.
        # Note: scope is the TS frontend; Rust backend + generated bindings are
        # excluded (Rust has its own dead-code analysis via cargo clippy).
        run: pnpm knip

      - name: Type coverage ratchet (≥ 99.9%)
        # Pedro's Quality Enforcement Standard TS-monorepo lever #2: closes the
        # `as any` escape hatch agents use to green `tsc`. Floor pinned at the
        # measured baseline (25246/25269 = 99.90%); ratchets UP as `any` is
        # removed, never loosens.
        run: pnpm type-coverage

      - name: Coverage check
        run: pnpm test:coverage

  backend:
    name: Backend Checks
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libspeechd-dev libasound2-dev libssl-dev pkg-config clang libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Stub frontend dist (tauri generate_context! reads frontendDist)
        run: |
          mkdir -p dist
          echo '<!doctype html><meta charset="utf-8"><title>Lectrice</title>' > dist/index.html

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --features test-mocks

      - name: Domain tests timing validation
        working-directory: src-tauri
        run: |
          START_TIME=$(date +%s)
          cargo test domain:: --features test-mocks --lib -- --test-threads=1 2>&1 || true
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "Domain tests completed in ${DURATION}s"
          if [ $DURATION -gt 5 ]; then
            echo "::warning::Domain tests took ${DURATION}s (expected <5s for pure domain logic)"
          fi

      - name: Build check
        working-directory: src-tauri
        run: cargo build --release

  contract-tests:
    name: Contract Tests
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libspeechd-dev libasound2-dev libssl-dev pkg-config clang libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Stub frontend dist (tauri generate_context! reads frontendDist)
        run: |
          mkdir -p dist
          echo '<!doctype html><meta charset="utf-8"><title>Lectrice</title>' > dist/index.html

      - name: Run contract tests
        working-directory: src-tauri
        run: cargo test --features test-mocks --test '*'
