name: macOS Flake

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: macos-flake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: macOS flake package
    # This public repository never sends pull-request head code to Pedro's
    # personal-data host. Only protected-main pushes and explicit dispatches
    # reach the repo-scoped runner.
    runs-on: [self-hosted, macOS, ARM64, lectrice-mac]
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build locked Apple-silicon app
        id: build
        run: |
          set -euo pipefail
          output="$(caffeinate -dimsu nix build .#lectrice \
            --no-link --print-out-paths \
            --max-jobs 1 --cores 3)"
          [ "$(printf '%s\n' "$output" | grep -c .)" -eq 1 ]
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Verify immutable bundle identity
        env:
          LECTRICE_OUT: ${{ steps.build.outputs.output }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          ./scripts/verify-macos-flake.sh \
            --output "$LECTRICE_OUT" \
            --expected-version "$(jq -er .version package.json)" \
            --receipt ci-evidence/macos-flake.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Negative control rejects a missing app
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          empty="$RUNNER_TEMP/empty-lectrice-output"
          mkdir -p "$empty"
          if ./scripts/verify-macos-flake.sh --output "$empty" \
            >"$RUNNER_TEMP/negative.stdout" \
            2>"$RUNNER_TEMP/negative.stderr"; then
            echo "FAIL: malformed package passed the macOS verifier" >&2
            exit 1
          fi
          grep -Fq 'package has no Applications directory' \
            "$RUNNER_TEMP/negative.stderr"
          echo 'Negative control: malformed package refused.' >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote macos-green
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 5
    permissions:
      contents: write

    # Token-bearing job checks out and executes no repository code. It only
    # performs a non-force fast-forward after the Mac build has succeeded.
    steps:
      - name: Fast-forward verified channel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/git/ref/heads/macos-green" \
            --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$current" ]; then
            gh api "repos/$REPO/git/refs" --method POST \
              -f ref="refs/heads/macos-green" \
              -f sha="$VERIFIED_SHA" >/dev/null
          else
            relation="$(gh api "repos/$REPO/compare/$current...$VERIFIED_SHA" \
              --jq '.status')"
            case "$relation" in
              ahead)
                gh api "repos/$REPO/git/refs/heads/macos-green" --method PATCH \
                  -f sha="$VERIFIED_SHA" -F force=false >/dev/null
                ;;
              identical) ;;
              *)
                echo "FAIL: refusing non-fast-forward promotion ($relation)" >&2
                exit 1
                ;;
            esac
          fi
          promoted="$(gh api "repos/$REPO/git/ref/heads/macos-green" \
            --jq '.object.sha')"
          [ "$promoted" = "$VERIFIED_SHA" ]
          printf 'Promoted %s to macos-green.\n' "$promoted" \
            >> "$GITHUB_STEP_SUMMARY"
