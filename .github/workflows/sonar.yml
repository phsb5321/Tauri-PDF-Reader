# sonar — SonarQube analysis with a HARD-BLOCKING quality gate. Self-hosted
# instance (sonarqube.home301server.com.br, per Pedro's sonar-integration-runbook).
# The fast CI lane (ci.yml: frontend/backend/contract/alignment/knip) stays
# independent + $0; this workflow feeds SonarQube fresh coverage, then blocks
# on the quality gate.
#
# Scope: TypeScript frontend (src/). SonarQube Community does not analyze Rust
# natively; importing src-tauri/src via clippy external issues is a follow-up
# (needs a pinned, verified clippy→Sonar report path — a silent empty fallback
# would let the gate pass with Rust unanalyzed, so it is out of scope until it
# can fail closed).
#
# Trigger: `main` ONLY. SonarQube Community Build analyzes a SINGLE branch —
# no PR/branch analysis, so running on pull_request would re-analyze the PR
# branch AS main and overwrite the dashboard, not produce a real PR gate. This
# is a MAIN-branch quality gate: the qualitygate.wait step fails the post-merge
# `main` run if the gate breaks (a loud, immediate regression alarm). Per-PR
# pre-merge quality is the fast `ci.yml` lane (alignment + knip + tests).
#
# ⚠ PEDRO-GATED PREREQUISITES (runbook: 2. Areas/👷 Work/sonar-integration-runbook.md):
#   1. Create project `phsb5321_lectrice` at https://sonarqube.home301server.com.br
#      (Administration → Projects → Create).
#   2. Generate PROJECT_ANALYSIS_TOKEN (project-scoped, 90d) → store as GitHub
#      secret `SONAR_TOKEN`.
#   3. Add GitHub variable `SONAR_HOST_URL` = `https://sonarqube.home301server.com.br`.
#   Until all three exist, the "Require SonarQube host" step below will fail
#   CLOSED — no silent no-op.
#
# Release-eng invariants (per global CLAUDE.md): deny-all permissions + per-job
# re-grant, PROJECT_ANALYSIS_TOKEN (project-scoped, never USER_TOKEN), pinned
# actions. No coverage/issue exclusions — honest numbers.
name: sonar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  scan:
    runs-on: [self-hosted, Linux, X64, vm103]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for blame-based new-code coverage

      # Fail CLOSED: silently skipping would let a green `scan` check hide a
      # no-op with no analysis. The host/token must be configured.
      - name: Require SonarQube host + token (fail closed)
        env:
          HOST: ${{ vars.SONAR_HOST_URL }}
          TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$HOST" ] || [ -z "$TOKEN" ]; then
            echo "::error::SONAR_HOST_URL or SONAR_TOKEN not set — see sonar-integration-runbook. The Sonar gate must not silently no-op."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage (emits coverage/lcov.info)
        run: pnpm test:coverage

      # The quality gate BLOCKS: qualitygate.wait=true makes the action poll the
      # gate and FAIL the job if it is not green.
      - name: SonarQube scan + quality-gate wait
        uses: SonarSource/sonarqube-scan-action@v4.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
