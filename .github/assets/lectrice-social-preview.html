<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lectrice — GitHub social preview</title>
    <!--
      Assumptions: this is a fixed 1280×640 identity card, not a product UI.
      Role: recognition in a link preview, viewed at laptop/phone distance.
      Tone: quiet, literary, warm. Capacity: bird, name, tagline, category only.
      The trace and its open beak are the signature; the voice leaves the beak.
      Real local Fraunces 600 / opsz 144 / WONK 1, never model-generated text.
      The brief approves the direction; no new mark or speculative UI is drawn.
      Sources and regeneration: ../../docs/brand/README.md.
    -->
    <style>
      @font-face {
        font-family: Fraunces;
        src: url("../../docs/brand/fonts/Fraunces.ttf") format("truetype");
        font-weight: 100 900;
      }
      @font-face {
        font-family: Newsreader;
        src: url("../../docs/brand/fonts/Newsreader.ttf") format("truetype");
        font-weight: 200 800;
      }
      :root {
        --paper: #f4efe4;
        --ink: #14110d;
        --vermilion: #c8462c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--paper);
        color: var(--ink);
      }
      main {
        position: relative;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: var(--paper);
      }
      .bird {
        position: absolute;
        left: 96px;
        top: 142px;
        width: 292px;
        height: 328px;
        color: var(--vermilion);
      }
      .voice {
        position: absolute;
        inset: 0;
        color: var(--vermilion);
      }
      h1 {
        position: absolute;
        left: 446px;
        top: 237px;
        font:
          600 152px / 1 Fraunces,
          serif;
        font-optical-sizing: none;
        font-variation-settings:
          "opsz" 144,
          "wght" 600,
          "SOFT" 0,
          "WONK" 1;
        letter-spacing: -0.035em;
      }
      .tagline {
        position: absolute;
        left: 454px;
        top: 404px;
        font:
          400 38px / 1.2 Newsreader,
          serif;
        font-optical-sizing: none;
        font-variation-settings:
          "opsz" 60,
          "wght" 400;
      }
      .category {
        position: absolute;
        left: 456px;
        top: 508px;
        font:
          500 23px / 1.2 Newsreader,
          serif;
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>

      aria-label="Lectrice. Every page, read aloud. Local-first PDF reader."
    >

        viewBox="0 0 769.000000 863.000000"
        role="img"

        <g

          <path

      </svg>
      <svg
        class="voice"
        width="1280"
        height="640"
        viewBox="0 0 1280 640"
        aria-hidden="true"
      >
        <path
          d="M360 170 C466 141 558 143 669 156 S975 179 1280 169"

      <h1>Lectrice</h1>
      <p class="tagline">Every page, read aloud.</p>
      <p class="category">LOCAL-FIRST PDF READER</p>
    </main>
  </body>
</html>
