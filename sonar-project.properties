sonar.projectKey=phsb5321_lectrice
sonar.projectName=Lectrice
sonar.organization=phsb5321

# Scope: TypeScript frontend ONLY. SonarQube Community does not analyze Rust
# natively; importing src-tauri/src via clippy external issues is a follow-up
# (it needs a pinned clippy→Sonar report path — a silent empty fallback would
# let the gate pass with Rust unanalyzed, so it is out of scope until it can
# fail closed). Until then Rust is out of scope, not masked. NO coverage/issue
# exclusions: honest numbers (mirrors interview-copilot/sonar-project.properties).
sonar.sources=src
sonar.tests=src/__tests__
sonar.exclusions=src/lib/bindings.ts,**/*.test.ts,**/*.spec.ts,src/e2e-native-bootstrap.ts
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
