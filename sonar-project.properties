sonar.projectKey=phsb5321_lectrice
sonar.projectName=Lectrice
sonar.organization=phsb5321

# Scope: TypeScript frontend ONLY. SonarQube Community does not analyze Rust
# natively; importing src-tauri/src via clippy external issues is a follow-up
# (it needs a pinned clippy→Sonar report path — a silent empty fallback would
# let the gate pass with Rust unanalyzed, so it is out of scope until it can
# fail closed). Until then Rust is out of scope, not masked. No broad source or
# coverage exclusions: honest numbers (mirrors interview-copilot/sonar-project.properties).
sonar.sources=src
sonar.tests=src/__tests__
# `sonar.tests` sits INSIDE `sonar.sources`, so the scanner sees every file under
# it as both a main file and a test file and aborts the whole run (EXECUTION
# FAILURE, exit 3) on the first one: "can't be indexed twice. Please check that
# inclusion/exclusion patterns produce disjoint sets". `src/__tests__/**` excludes
# the test root from the MAIN set only — files there are still analysed, as tests.
# It has to be the whole root, not the fixtures that exposed it: the `**/*.test.*`
# patterns below were masking the overlap by accident, and did so right up until
# PR #48 added the first file under it that is not named `*.test.*`. The `*.test.*`
# / `*.spec.*` entries stay because tests also live outside the test root.
sonar.exclusions=src/lib/bindings.ts,src/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/e2e-native-bootstrap.ts
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Known false positive: css:S4670 flags standard @media queries as "unknown type
# selectors" — a SonarQube CSS parser bug, not a real issue. Scoped suppression
# (rule-level on CSS files only); per-issue marking requires admin API access we
# don't have on the project-scoped token.

# Style-preference rules that don't represent real quality issues for Lectrice.
# These are documented suppressions (removing false signal from the dashboard),
# not masking — the real issues (S6819 tag-over-role, S6759 readonly-props,
# etc.) stay visible for proper triage.
sonar.issue.ignore.multicriteria=css1,ts1,ts2,ts3
sonar.issue.ignore.multicriteria.css1.ruleKey=css:S4670
sonar.issue.ignore.multicriteria.css1.resourceKey=**/*.css
sonar.issue.ignore.multicriteria.ts1.ruleKey=typescript:S7764
sonar.issue.ignore.multicriteria.ts1.resourceKey=**/*.ts*
sonar.issue.ignore.multicriteria.ts2.ruleKey=typescript:S7748
sonar.issue.ignore.multicriteria.ts2.resourceKey=**/*.ts*
sonar.issue.ignore.multicriteria.ts3.ruleKey=typescript:S7773
sonar.issue.ignore.multicriteria.ts3.resourceKey=**/*.ts*
