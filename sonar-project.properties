sonar.projectKey=phsb5321_lectrice
sonar.projectName=Lectrice
sonar.organization=phsb5321

# Scope: TypeScript frontend ONLY. SonarQube Community does not analyze Rust
# natively; importing src-tauri/src via clippy external issues is a follow-up
# (it needs a pinned clippy→Sonar report path — a silent empty fallback would
# let the gate pass with Rust unanalyzed, so it is out of scope until it can
# fail closed). Until then Rust is out of scope, not masked. NO coverage/issue
# exclusions: honest numbers (mirrors interview-copilot/sonar-project.properties).
sonar.sources=src
sonar.tests=src/__tests__
sonar.exclusions=src/lib/bindings.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/e2e-native-bootstrap.ts
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Known false positive: css:S4670 flags standard @media queries as "unknown type
# selectors" — a SonarQube CSS parser bug, not a real issue. Scoped suppression
# (rule-level on CSS files only); per-issue marking requires admin API access we
# don't have on the project-scoped token.
sonar.issue.ignore.multicriteria=css1
sonar.issue.ignore.css1.ruleKey=css:S4670
sonar.issue.ignore.css1.resourceKey=**/*.css
