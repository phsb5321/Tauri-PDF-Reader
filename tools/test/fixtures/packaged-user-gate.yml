name: Packaged User Gate

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *" # nightly full matrix

permissions:
  contents: read

concurrency:
  # ONE fixed runner-wide group (never github.ref): the lane scripts write
  # global /tmp evidence paths, so only one packaged-user-gate run may ever
  # execute at a time. The single-slot runner serializes anyway; the group
  # makes it structural and cancels superseded heads.
  group: packaged-user-gate
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CI: "true"

jobs:
  contract:
    # Trusted-base architecture: this job checks out the BASE branch's tools
    # (never the head's copy — the contract cannot be head-controlled) and
    # validates the HEAD's workflow file fetched via the API. The self-hosted
    # runner executes PRs ONLY from this repository (fork PRs are excluded).
    name: Gate contract (base tools vs head file)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 10

    steps:
      - name: Checkout BASE tools (never the head's copy)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Setup Node.js (the parser-based checker needs node + yaml)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Install dependencies (yaml is an explicit devDependency)
        run: pnpm install --frozen-lockfile

      - name: Bootstrap anchor check — base must own the gate tools
        # Trusted-base architecture: the checker that runs here must come
        # from BASE. This PR is the FIRST introduction of the workflow and
        # checker — base does not own them yet, so PR-controlled self-hosted
        # execution is INERT on this bootstrap PR: the contract job fails
        # with this exact message, pr-fast is needs-gated off it, and no
        # head-controlled lane runs. The merge anchors base; every later PR
        # is enforced by the base-owned copy.
        run: |
          if [ ! -x tools/check-packaged-gate-contract.sh ]; then
            echo "BOOTSTRAP-INERT: base ${{ github.event.pull_request.base.sha || github.sha }} does not yet own tools/check-packaged-gate-contract.sh — this PR only lands the infrastructure; pr-fast is needs-gated off this failure. A follow-up PR after the base anchor can enable base-owned enforcement."
            exit 1
          fi

      - name: Fetch the HEAD workflow file and run the BASE contract against it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILE_REF="${{ github.event.pull_request.head.sha }}"
          else
            FILE_REF="${{ github.sha }}"
          fi
          gh api "repos/${{ github.repository }}/contents/.github/workflows/packaged-user-gate.yml?ref=$FILE_REF" \
            --jq '.content' | base64 -d > /tmp/head-workflow.yml
          ./tools/check-packaged-gate-contract.sh /tmp/head-workflow.yml

      - name: Contract negative-control (base tools, head file)
        env:
          PACKAGED_GATE_WF: /tmp/head-workflow.yml
        run: ./tools/test/packaged-gate-contract-negative-control.sh

  pr-fast:
    # Same-repo PRs only: the self-hosted runner never executes fork PRs.
    name: Packaged PR-fast lane (critical-loop)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: contract
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert tauri-driver inside the PINNED flake devShell (BLOCKED if missing)
        # The flake devShell is the ONE pinned toolchain place (#101): it ships
        # tauri-driver (packages.tauri-driver, fetchCrate 2.0.6 + cargoLock) and
        # the pinned rust (rustPlatform.rust). No host provisioning, no
        # ~/.cargo/bin symlink, no runtime cargo install. A missing driver
        # means the pinned flake build failed — BLOCKED with a machine-readable
        # receipt before any lane log exists.
        run: |
          if ! nix develop -c bash -c 'command -v tauri-driver' >/dev/null 2>&1; then
            mkdir -p ci-evidence
            printf '{"blocked":"tauri-driver not provided by the pinned flake devShell","remedy":"the flake packages.tauri-driver must build (nix build .#tauri-driver); no host provisioning is required","time":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-evidence/prerequisite-failure.json
            echo "BLOCKED: tauri-driver not in the pinned devShell — see ci-evidence/prerequisite-failure.json"
            exit 1
          fi

      - name: Prerequisite receipt enforced (a blocked assert without its receipt fails)
        if: failure()
        run: |
          [ -f ci-evidence/prerequisite-failure.json ] || { echo "FAIL: BLOCKED prerequisite without its machine-readable receipt — evidence discipline broken"; exit 1; }

      - name: Packaged PR-fast lane — hermetic profile, X11 pin, Xvfb
        # The repo's own runner: shared profile (#99 fail-closed) + flake
        # devShell toolchain (#101 single source) + GDK_BACKEND=x11 (the
        # negative-devicePixelRatio class) + Xvfb via -displayfd. Fixed /tmp
        # evidence paths cleared first — a prior job's leftovers must never
        # ride along (single-slot runner + per-ref concurrency = no live
        # collision; the clear is defense in depth).
        run: |
          rm -f /tmp/lectrice-e2e-critical-loop-xvfb.log /tmp/lectrice-matrix-critical-loop.log
          bash e2e/run-critical-loop.sh

      - name: Copy failure evidence into the workspace (upload-artifact cannot read /tmp)
        if: failure()
        run: |
          mkdir -p ci-evidence
          cp /tmp/lectrice-e2e-critical-loop-xvfb.log ci-evidence/ 2>/dev/null || true
          cp /tmp/lectrice-matrix-critical-loop.log ci-evidence/ 2>/dev/null || true

      - name: Upload failure artifacts (honest evidence, never skipped-green)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-fast-failure-evidence
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 7

  full-matrix:
    name: Full packaged matrix (all lanes, strictly serial)
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert tauri-driver inside the PINNED flake devShell (BLOCKED if missing)
        run: |
          if ! nix develop -c bash -c 'command -v tauri-driver' >/dev/null 2>&1; then
            mkdir -p ci-evidence
            printf '{"blocked":"tauri-driver not provided by the pinned flake devShell","remedy":"the flake packages.tauri-driver must build (nix build .#tauri-driver); no host provisioning is required","time":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-evidence/prerequisite-failure.json
            echo "BLOCKED: tauri-driver not in the pinned devShell — see ci-evidence/prerequisite-failure.json"
            exit 1
          fi

      - name: Prerequisite receipt enforced (a blocked assert without its receipt fails)
        if: failure()
        run: |
          [ -f ci-evidence/prerequisite-failure.json ] || { echo "FAIL: BLOCKED prerequisite without its machine-readable receipt — evidence discipline broken"; exit 1; }

      - name: Run all packaged lanes — one at a time
        # Serial by construction: one job loops the eight self-contained lane
        # runners. The single-slot runner must never be stampeded.
        run: |
          rm -f /tmp/lectrice-matrix-*.log /tmp/lectrice-e2e-*-xvfb.log
          bash scripts/e2e-matrix.sh

      - name: Copy failure evidence into the workspace (upload-artifact cannot read /tmp)
        if: failure()
        run: |
          mkdir -p ci-evidence
          cp /tmp/lectrice-matrix-*.log ci-evidence/ 2>/dev/null || true
          cp /tmp/lectrice-e2e-*-xvfb.log ci-evidence/ 2>/dev/null || true

      - name: Upload failure artifacts (per-lane evidence)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-matrix-failure-evidence
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 7

  real-corpus:
    # Post-merge/manual REAL-corpus soak (docs/packaged-lanes.md). NEVER on
    # pull_request — PR-fast stays deterministic fixtures. Consumes
    # LECTRICE_REAL_PDF_CORPUS (a LOCAL dir on the runner; the five-book Data
    # Engineering corpus). Copyright boundary: the hook stages a TRANSIENT
    # copy inside the hermetic profile (fs scope) and the artifact upload
    # below carries ONLY logs + summary — never PDFs or derived renders.
    # Run-scoped temps: LECTRICE_CORPUS_OUT lands under runner.temp (per-job),
    # so fixed-path collisions across runs are impossible.
    name: Real-corpus soak (real PDFs, post-merge/manual)
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: [self-hosted, Linux, X64, vm103]
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert tauri-driver inside the PINNED flake devShell (BLOCKED if missing)
        run: |
          if ! nix develop -c bash -c 'command -v tauri-driver' >/dev/null 2>&1; then
            mkdir -p ci-evidence
            printf '{"blocked":"tauri-driver not provided by the pinned flake devShell","remedy":"the flake packages.tauri-driver must build (nix build .#tauri-driver); no host provisioning is required","time":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-evidence/prerequisite-failure.json
            echo "BLOCKED: tauri-driver not in the pinned devShell — see ci-evidence/prerequisite-failure.json"
            exit 1
          fi

      - name: Prerequisite receipt enforced (a blocked assert without its receipt fails)
        if: failure()
        run: |
          [ -f ci-evidence/prerequisite-failure.json ] || { echo "FAIL: BLOCKED prerequisite without its machine-readable receipt — evidence discipline broken"; exit 1; }

      - name: Assert the real corpus is provisioned locally (BLOCKED if missing)
        # The corpus lives on the host (never a URL); the hook never stores
        # or uploads the PDFs. Same receipt discipline as the driver assert.
        run: |
          if [ -z "$LECTRICE_REAL_PDF_CORPUS" ]; then
            mkdir -p ci-evidence
            printf '{"blocked":"LECTRICE_REAL_PDF_CORPUS unset","remedy":"set it in the runner .env (local dir, e.g. /home/notroot/corpus-de)","time":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-evidence/prerequisite-failure.json
            echo "BLOCKED: LECTRICE_REAL_PDF_CORPUS unset — see ci-evidence/prerequisite-failure.json"
            exit 1
          fi
          [ -d "$LECTRICE_REAL_PDF_CORPUS" ] || {
            mkdir -p ci-evidence
            printf '{"blocked":"LECTRICE_REAL_PDF_CORPUS is not a directory","path":"%s","time":"%s"}\n' "$LECTRICE_REAL_PDF_CORPUS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-evidence/prerequisite-failure.json
            echo "BLOCKED: LECTRICE_REAL_PDF_CORPUS=$LECTRICE_REAL_PDF_CORPUS is not a directory — see ci-evidence/prerequisite-failure.json"; exit 1; }

      - name: Run the real-corpus soak (per-book phases, machine-readable summary)
        # Run-scoped evidence dir: $RUNNER_TEMP is per-job, so fixed-path
        # collisions across runs are impossible.
        run: |
          rm -rf "$RUNNER_TEMP/lectrice-corpus"
          LECTRICE_CORPUS_OUT="$RUNNER_TEMP/lectrice-corpus" bash scripts/e2e-real-corpus.sh

      - name: Copy evidence into the workspace (logs + summary ONLY — never the corpus)
        # ALWAYS runs: after a prerequisite BLOCKED the receipt in ci-evidence
        # must still reach the artifact upload (default success() would skip it).
        if: always()
        run: |
          mkdir -p ci-evidence/corpus
          cp -r "${RUNNER_TEMP}/lectrice-corpus"/* ci-evidence/corpus/ 2>/dev/null || true

      - name: Upload corpus soak evidence (logs + summary; PDFs never leave the host)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-corpus-evidence
          path: |
            ci-evidence/corpus/
            ci-evidence/prerequisite-failure.json
          if-no-files-found: warn
          retention-days: 7
