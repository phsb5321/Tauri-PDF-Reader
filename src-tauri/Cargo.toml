[package]
name = "tauri-pdf-reader"
version = "0.2.0"
description = "Lectrice — a local-first desktop PDF reader with highlighting and high-quality text-to-speech"
authors = ["Pedro H S Balbino"]
edition = "2021"

[lib]
name = "tauri_pdf_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Persists the fs plugin's runtime scope grants (the per-file allowance that
# dialog.open() adds for a picked PDF) across restarts, so library documents
# reopen without re-prompting. Does NOT widen the static capability scope.
tauri-plugin-persisted-scope = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tts = { version = "0.26", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.19"
async-trait = "0.1"
thiserror = "1.0"

# Testing mocks (optional for integration tests)
mockall = { version = "0.13", optional = true }

# Type generation for frontend
specta = { version = "2.0.0-rc.20", features = ["chrono", "uuid"] }
specta-typescript = "0.0.7"
tauri-specta = { version = "2.0.0-rc.20", features = ["typescript"] }

# AI TTS (ElevenLabs) and audio export
rodio = { version = "0.20", optional = true }
# Pitch-preserving time-stretch (tempo without pitch shift) for variable playback
# speed — spec 039. MIT; builds vendored C++ via cc+bindgen (needs libclang).
signalsmith-stretch = { version = "0.1.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "native-tls-vendored"], optional = true }
tokio = { version = "1", features = ["sync", "rt", "time", "macros"], optional = true }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
dirs = "6.0.0"

# User config file (spec 078, slice 1: read-only). `toml` carries byte spans on
# its errors, which is what lets a bad value report file:line:col instead of a
# bare "invalid type"; `serde_ignored` collects unknown keys so a typo warns
# instead of bricking the config. `toml_edit` (comment-preserving writer) and
# `notify-debouncer-mini` (hot reload) belong to slices 2 and 3 — they have no
# call site yet, and an unused dependency is exactly what the alignment gate
# should catch.
toml = "0.8"
serde_ignored = "0.1"

# Audio export with chapter markers
id3 = "1.14"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"

[dev-dependencies]
mockall = "0.13"
tokio = { version = "1", features = ["rt", "macros"] }
# Spectral assertion for the pitch-preserving time-stretch gate (spec 039).
rustfft = "6"
# Config round-trip property (spec 078): Config -> toml -> Config must be the
# identity, or the slice-2 UI writer would silently corrupt a user's file.
proptest = "1"

[features]
default = ["custom-protocol", "elevenlabs-tts"]
custom-protocol = ["tauri/custom-protocol"]
native-tts = ["tts"]
elevenlabs-tts = ["rodio", "reqwest", "tokio", "futures", "bytes", "base64", "signalsmith-stretch"]
# Enable mocks for integration tests
test-mocks = ["mockall"]
# E2E-only: makes ai_tts_init/ai_tts_speak_with_timestamps return deterministic
# fixture marks with NO network + NO audio output, so the real play-button path
# can be driven under WebDriver/Xvfb. Never in `default` — opt-in build flag for
# `e2e/native-play.e2e.mjs` only.
e2e-tts-fixture = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
